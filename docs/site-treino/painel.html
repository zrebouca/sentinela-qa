<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Painel — Loja Treino</title><link rel="stylesheet" href="estilo.css"></head>
<body>
<header><b>Loja Treino</b><a href="cadastro.html">Cadastrar cliente</a><a href="index.html" id="sair">Sair</a></header>
<main>
  <h1 id="boas-vindas">Bem-vindo!</h1>
  <label for="busca">Buscar produto</label>
  <input id="busca" type="search" placeholder="Buscar produto">
  <ul class="itens" id="lista">
    <li>Caderno universitário</li><li>Caneta azul</li><li>Mochila escolar</li><li>Garrafa térmica</li>
  </ul>
  <p id="sem-resultado" hidden>Nenhum produto encontrado.</p>
  <button id="carregar">Carregar ofertas</button>
  <p id="carregando" hidden>Carregando...</p>
  <p id="ofertas" hidden>3 ofertas disponíveis hoje!</p>
</main>
<script>
  const u = sessionStorage.getItem('usuario');
  if (!u) location.href = 'index.html';
  document.getElementById('boas-vindas').textContent = `Bem-vindo, ${u}!`;
  const busca = document.getElementById('busca');
  function filtrar() {
    let visiveis = 0;
    document.querySelectorAll('#lista li').forEach(li => {
      const ok = li.textContent.toLowerCase().includes(busca.value.toLowerCase());
      li.hidden = !ok; if (ok) visiveis++;
    });
    document.getElementById('sem-resultado').hidden = visiveis > 0;
  }
  busca.addEventListener('input', filtrar);
  busca.addEventListener('keydown', e => { if (e.key === 'Enter') filtrar(); });
  // Conteúdo que aparece depois de um tempo (para testar esperas automáticas)
  document.getElementById('carregar').addEventListener('click', () => {
    document.getElementById('carregando').hidden = false;
    setTimeout(() => { document.getElementById('carregando').hidden = true; document.getElementById('ofertas').hidden = false; }, 1200);
  });
</script>
</body>
</html>

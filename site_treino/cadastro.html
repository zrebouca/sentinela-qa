<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Cadastro — Loja Treino</title><link rel="stylesheet" href="estilo.css"></head>
<body>
<header><b>Loja Treino</b><a href="painel.html">Voltar ao painel</a></header>
<main>
  <h1>Cadastrar cliente</h1>
  <form id="form-cadastro" novalidate>
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome"><div class="erro-campo" id="erro-nome"></div>
    <label for="email">E-mail</label>
    <input id="email" name="email"><div class="erro-campo" id="erro-email"></div>
    <label for="cpf">CPF</label>
    <input id="cpf" name="cpf" placeholder="000.000.000-00"><div class="erro-campo" id="erro-cpf"></div>
    <label for="cep">CEP</label>
    <input id="cep" name="cep" placeholder="00000-000"><div class="erro-campo" id="erro-cep"></div>
    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone"><div class="erro-campo" id="erro-telefone"></div>
    <button type="submit" id="salvar">Salvar cadastro</button>
  </form>
  <div id="resumo" class="alerta" role="alert"></div>
</main>
<script>
  // Regras de validação. ATENÇÃO: o telefone NÃO é validado de propósito —
  // é o "bug plantado" que a exploração do Sentinela deve encontrar.
  function cpfValido(cpf) {
    const n = cpf.replace(/\D/g, '');
    if (n.length !== 11 || /^(\d)\1+$/.test(n)) return false;
    for (const t of [9, 10]) {
      let soma = 0;
      for (let i = 0; i < t; i++) soma += +n[i] * (t + 1 - i);
      if ((soma * 10) % 11 % 10 !== +n[t]) return false;
    }
    return true;
  }
  const regras = {
    nome: v => v.trim().length >= 3 && /^[A-Za-zÀ-ÿ' ]+$/.test(v.trim()) ? '' : 'Informe o nome completo (só letras).',
    email: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? '' : 'E-mail inválido.',
    cpf: v => cpfValido(v) ? '' : 'CPF inválido.',
    cep: v => /^\d{5}-?\d{3}$/.test(v) ? '' : 'CEP deve ter 8 números.',
    telefone: v => '',
  };
  document.getElementById('form-cadastro').addEventListener('submit', e => {
    e.preventDefault();
    let erros = 0;
    for (const [campo, regra] of Object.entries(regras)) {
      const msg = regra(document.getElementById(campo).value);
      document.getElementById('erro-' + campo).textContent = msg;
      if (msg) erros++;
    }
    const resumo = document.getElementById('resumo');
    if (erros) { resumo.className = 'alerta erro'; resumo.textContent = `Corrija ${erros} campo(s) antes de salvar.`; return; }
    location.href = 'sucesso.html';
  });
</script>
</body>
</html>
